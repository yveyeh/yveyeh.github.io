[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Yufenyuy Veyeh Didier", email = "yveyeh@kmail.africa" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=27.0.0",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=core --cov=models --cov=repositories --cov=seed --cov=services --cov-report=term-missing --cov-fail-under=85"

