<div class="min-h-screen bg-navy-900 text-white font-sans antialiased selection:bg-gold-400 selection:text-navy-900">
  <AppsLauncher />
  <ReadingProgressBar :progress="scrollProgress" />

  <!-- Navigation Header -->
  <header class="sticky top-0 z-40 border-b border-white/10 bg-navy-900/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-4">
        <router-link
          to="/blog"
          class="group inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-white/70 transition hover:text-gold-300"
        >
          <span class="transition-transform duration-300 group-hover:-translate-x-1">←</span>
          <span>Articles</span>
        </router-link>
        <router-link
          to="/jobs"
          class="hidden sm:inline-block text-xs font-semibold uppercase tracking-wider text-gold-400/90 transition hover:text-gold-300"
        >
          Tech Opportunities
        </router-link>
      </div>

      <div class="flex items-center gap-3">
        <button
          @click="copyLink"
          class="inline-flex items-center gap-1.5 rounded-full border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-medium text-white/80 transition hover:bg-white/10 hover:text-white cursor-pointer"
        >
          <span>{{ copied ? '✓ Copied' : 'Share Link' }}</span>
        </button>
        <router-link
          to="/admin"
          class="rounded-full border border-gold-400/30 bg-gold-400/10 px-3 py-1.5 text-xs font-semibold text-gold-300 transition hover:bg-gold-400 hover:text-navy-900"
        >
          Admin
        </router-link>
      </div>
    </div>
  </header>

  <!-- Post Not Found -->
  <div v-if="!post" class="mx-auto max-w-2xl px-6 py-28 text-center">
    <h1 class="text-4xl font-bold text-white">Article Not Found</h1>
    <p class="mt-4 text-white/70">The requested article could not be located or may have been updated.</p>
    <router-link
      to="/blog"
      class="mt-8 inline-block rounded-full bg-gold-400 px-6 py-3 text-xs font-bold uppercase tracking-wider text-navy-900 shadow-md"
    >
      Browse All Articles
    </router-link>
  </div>

  <!-- Article Content -->
  <main v-else class="mx-auto max-w-4xl px-6 py-12 lg:py-16">
    <ArticleHeader :post="post" />

    <!-- Post Metrics Bar (Views, Shares, Comments, Read Time) -->
    <div class="mb-10 rounded-2xl border border-white/10 bg-navy-800/40 p-4 backdrop-blur-sm">
      <PostMetrics
        :views="interactions.views"
        :shares="interactions.shares"
        :comments-count="interactions.comments.length"
        :read-time="post.readTime"
      />
    </div>

    <!-- Markdown Prose Body -->
    <article
      class="prose prose-invert prose-gold max-w-none text-white/90 leading-relaxed font-light text-base sm:text-lg"
      v-html="parsedContent"
    />

    <!-- Reactions and Share Bar -->
    <PostInteractionBar
      :title="post.title"
      :shares="interactions.shares"
      :reactions="interactions.reactions"
      :user-reactions="interactions.userReactions"
      @react="toggleReaction"
      @shared="trackShare"
    />

    <!-- Tags Section -->
    <div v-if="post.tags && post.tags.length" class="mt-10 flex flex-wrap items-center gap-2 border-t border-white/10 pt-6">
      <span class="text-xs font-semibold uppercase tracking-wider text-white/50">Topics:</span>
      <span
        v-for="t in post.tags"
        :key="t"
        class="rounded-md bg-white/10 px-3 py-1 text-xs font-medium text-white/80"
      >
        #{{ t }}
      </span>
    </div>

    <!-- Author Bio Card -->
    <AuthorBioCard :author="post.author" />

    <!-- Comments Section (Comments List + Form) -->
    <PostCommentsSection
      :comments="interactions.comments"
      @add-comment="({ name, content, handle }) => addComment(name, content, handle)"
    />

    <!-- Recommended Articles -->
    <section v-if="recommendedPosts.length" class="mt-16 border-t border-white/10 pt-12">
      <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-white/60 mb-6">Continue Reading</h2>
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <RecommendedCard v-for="rec in recommendedPosts" :key="rec.id" :post="rec" />
      </div>
    </section>
  </main>
</div>
