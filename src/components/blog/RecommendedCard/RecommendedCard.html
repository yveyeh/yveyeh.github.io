<router-link
  :to="`/blog/${post.slug}`"
  class="group rounded-2xl border border-white/10 bg-navy-800/40 p-5 transition duration-300 hover:border-gold-400/40 hover:bg-navy-800/80"
>
  <span class="text-[11px] font-semibold uppercase tracking-wider text-gold-400">{{ post.category }}</span>
  <h4 class="mt-1.5 text-base font-bold text-white transition group-hover:text-gold-300">{{ post.title }}</h4>
  <span class="mt-3 block text-xs text-white/50">{{ post.readTime }} • Read article →</span>
</router-link>
