<form @submit.prevent="handleSubmit" class="rounded-3xl border border-white/10 bg-navy-800/40 p-5 sm:p-6 backdrop-blur-sm">
  <h3 class="text-sm font-bold tracking-wider text-white uppercase">Leave a Comment</h3>
  <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
    <input
      v-model="name"
      type="text"
      placeholder="Your Name *"
      required
      class="rounded-xl border border-white/15 bg-navy-900/80 px-3.5 py-2 text-xs text-white placeholder-white/40 focus:border-gold-400 focus:outline-none"
    />
    <input
      v-model="handle"
      type="text"
      placeholder="Twitter / GitHub / Title (optional)"
      class="rounded-xl border border-white/15 bg-navy-900/80 px-3.5 py-2 text-xs text-white placeholder-white/40 focus:border-gold-400 focus:outline-none"
    />
  </div>
  <textarea
    v-model="content"
    rows="3"
    placeholder="Share your thoughts, feedback, or technical questions... *"
    required
    class="mt-3 w-full rounded-xl border border-white/15 bg-navy-900/80 p-3.5 text-xs text-white placeholder-white/40 focus:border-gold-400 focus:outline-none resize-none"
  />
  <div class="mt-3 flex justify-end">
    <button
      type="submit"
      class="rounded-full bg-gold-400 px-5 py-2 text-xs font-bold uppercase tracking-wider text-navy-900 transition hover:bg-gold-300 active:scale-95 cursor-pointer"
    >
      Post Comment
    </button>
  </div>
</form>
