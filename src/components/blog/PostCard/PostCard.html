<article class="group flex flex-col justify-between rounded-3xl border border-white/10 bg-navy-800/60 p-6 shadow-xl backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:border-gold-400/40 hover:shadow-2xl hover:shadow-gold-500/10">
  <div>
    <div class="flex items-center justify-between gap-2 text-xs">
      <span class="rounded-full bg-navy-700/80 px-2.5 py-1 font-semibold tracking-wider text-gold-300 uppercase">
        {{ post.category }}
      </span>
      <span class="text-white/50 text-[11px]">{{ post.readTime }}</span>
    </div>
    <h3 class="mt-4 text-xl font-bold leading-snug tracking-tight text-white transition duration-300 group-hover:text-gold-300">
      <router-link :to="`/blog/${post.slug}`" class="focus:outline-none">
        {{ post.title }}
      </router-link>
    </h3>
    <p class="mt-2.5 text-sm leading-relaxed font-light text-white/70 line-clamp-3">
      {{ post.summary }}
    </p>
  </div>
  <div class="mt-6 border-t border-white/10 pt-4">
    <div class="mb-3 flex flex-wrap gap-1.5">
      <span v-for="tag in (post.tags || []).slice(0, 3)" :key="tag" class="rounded bg-white/5 px-2 py-0.5 text-[10px] font-medium text-white/60">
        #{{ tag }}
      </span>
    </div>
    <div class="flex items-center justify-between text-xs">
      <span class="text-white/40 text-[11px]">{{ post.date }}</span>
      <router-link :to="`/blog/${post.slug}`" class="font-semibold text-gold-400 transition hover:text-gold-300">
        Read →
      </router-link>
    </div>
  </div>
</article>
