<div class="flex items-center gap-2">
  <button
    @click="share"
    class="inline-flex items-center gap-1.5 rounded-xl border border-white/10 bg-navy-800/80 px-3.5 py-1.5 text-xs font-semibold text-white/80 transition hover:bg-white/10 hover:text-white cursor-pointer"
  >
    <span>{{ copied ? '✓ Copied' : '🔗 Share' }}</span>
    <span class="rounded bg-white/10 px-1.5 py-0.5 text-[10px] text-gold-400 font-mono">{{ shares }}</span>
  </button>
</div>
