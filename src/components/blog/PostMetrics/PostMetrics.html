<div class="flex flex-wrap items-center gap-3 sm:gap-4 text-xs text-white/65">
  <span class="inline-flex items-center gap-1.5" title="Total Views">
    <span class="text-gold-400">👁</span>
    <span>{{ views.toLocaleString() }} views</span>
  </span>
  <span class="text-white/30">•</span>
  <span class="inline-flex items-center gap-1.5" title="Total Shares">
    <span class="text-gold-400">↗</span>
    <span>{{ shares }} shares</span>
  </span>
  <span class="text-white/30">•</span>
  <span class="inline-flex items-center gap-1.5" title="Comments">
    <span class="text-gold-400">💬</span>
    <span>{{ commentsCount }} comments</span>
  </span>
  <span class="text-white/30">•</span>
  <span class="inline-flex items-center gap-1.5" title="Reading Time">
    <span>⏱</span>
    <span>{{ readTime }}</span>
  </span>
</div>
