<div class="flex flex-wrap items-center gap-2">
  <button
    v-for="item in emojiConfig"
    :key="item.type"
    @click="onReact(item.type)"
    :title="item.label"
    :class="[
      'flex items-center gap-1.5 rounded-xl border px-3 py-1.5 text-xs font-semibold transition-all duration-200 cursor-pointer select-none active:scale-95',
      userReactions[item.type]
        ? 'border-gold-400/60 bg-gold-400/20 text-gold-300 shadow-sm scale-105'
        : 'border-white/10 bg-navy-800/80 text-white/70 hover:border-white/25 hover:bg-navy-800 hover:text-white'
    ]"
  >
    <span class="text-sm">{{ item.icon }}</span>
    <span>{{ reactions[item.type] }}</span>
  </button>
</div>
