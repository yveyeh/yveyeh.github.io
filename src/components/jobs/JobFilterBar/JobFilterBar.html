<div class="rounded-2xl border border-white/10 bg-navy-800/50 shadow-xl shadow-black/20 backdrop-blur-md overflow-hidden">
  <!-- Search Row -->
  <div class="p-4 sm:p-5">
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-white/35">
        <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input
        id="jobs-search-input"
        type="text"
        :value="searchQuery"
        @input="onSearch"
        placeholder="Search roles, companies, skills (e.g. DevSecOps, Terraform, Kubernetes)..."
        class="w-full rounded-xl border border-white/8 bg-white/5 py-3 pr-4 pl-11 text-sm text-white placeholder-white/35 transition duration-200 focus:border-gold-400/50 focus:bg-white/8 focus:outline-none focus:ring-2 focus:ring-gold-400/30"
      />
      <!-- Clear button -->
      <button
        v-if="searchQuery"
        type="button"
        @click="clearSearch"
        class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-white/40 hover:text-white/80 transition-colors"
        aria-label="Clear search"
      >
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Filter Pill Row -->
  <div class="border-t border-white/5 px-4 py-3 sm:px-5 flex flex-col sm:flex-row sm:items-center gap-3">
    <!-- Workplace Filters -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-[11px] font-bold uppercase tracking-widest text-white/35 mr-0.5">Where:</span>
      <button
        v-for="opt in workplaceOptions"
        :key="opt.value"
        type="button"
        @click="setWorkplace(opt.value)"
        :aria-pressed="selectedWorkplace === opt.value"
        class="rounded-lg px-2.5 py-1 text-xs font-semibold transition-all duration-150"
        :class="selectedWorkplace === opt.value
          ? 'bg-gold-400 text-navy-950 shadow-sm shadow-gold-400/20'
          : 'bg-white/5 text-white/60 hover:bg-white/10 hover:text-white border border-white/8'"
      >
        {{ opt.label }}
      </button>
    </div>

    <div class="hidden sm:block w-px h-5 bg-white/10 mx-1 shrink-0" />

    <!-- Employment Filters -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-[11px] font-bold uppercase tracking-widest text-white/35 mr-0.5">Type:</span>
      <button
        v-for="opt in employmentOptions"
        :key="opt.value"
        type="button"
        @click="setEmployment(opt.value)"
        :aria-pressed="selectedEmployment === opt.value"
        class="rounded-lg px-2.5 py-1 text-xs font-semibold transition-all duration-150"
        :class="selectedEmployment === opt.value
          ? 'bg-gold-400 text-navy-950 shadow-sm shadow-gold-400/20'
          : 'bg-white/5 text-white/60 hover:bg-white/10 hover:text-white border border-white/8'"
      >
        {{ opt.label }}
      </button>
    </div>

    <!-- Spacer -->
    <div class="flex-1" />

    <!-- Results count + Reset -->
    <div class="flex items-center gap-3 shrink-0">
      <span class="text-xs text-white/40">
        <strong class="text-gold-300 font-bold">{{ filteredCount }}</strong>
        <span class="text-white/30"> / {{ totalJobsCount }}</span>
        roles
      </span>
      <button
        v-if="searchQuery || selectedWorkplace !== 'all' || selectedEmployment !== 'all'"
        type="button"
        @click="onReset"
        class="inline-flex items-center gap-1 rounded-lg border border-white/10 bg-white/5 px-2.5 py-1 text-xs font-semibold text-white/50 transition-all duration-150 hover:border-white/20 hover:text-white/80"
        aria-label="Clear all filters"
      >
        <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Clear
      </button>
    </div>
  </div>
</div>
