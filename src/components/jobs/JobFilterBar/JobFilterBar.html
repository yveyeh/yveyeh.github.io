<div class="rounded-3xl border border-white/10 bg-navy-800/40 p-5 sm:p-6 shadow-xl shadow-black/20 backdrop-blur-md">
  <!-- Search input -->
  <div class="relative">
    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-white/40">
      <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </span>
    <input
      id="jobs-search-input"
      type="text"
      :value="searchQuery"
      @input="onSearch"
      placeholder="Search by role (e.g. DevSecOps, SRE), company, or skills (Kubernetes, Terraform)..."
      class="w-full rounded-2xl border border-white/10 bg-white/5 py-3.5 pr-4 pl-12 text-sm text-white placeholder-white/40 transition duration-200 focus:border-gold-400/60 focus:bg-white/10 focus:outline-none focus:ring-2 focus:ring-gold-400/40"
    />
  </div>

  <!-- Filter Pills -->
  <div class="mt-4 flex flex-col md:flex-row md:items-center justify-between gap-4 pt-4 border-t border-white/5">
    <!-- Workplace Type Pills -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-xs font-semibold text-white/50 mr-1">Workplace:</span>
      <button
        v-for="opt in workplaceOptions"
        :key="opt.value"
        type="button"
        @click="setWorkplace(opt.value)"
        class="cursor-pointer rounded-xl px-3 py-1.5 text-xs font-medium transition duration-200"
        :class="selectedWorkplace === opt.value
          ? 'bg-gold-400 text-navy-950 font-bold shadow-sm shadow-gold-400/30'
          : 'bg-white/5 text-white/70 hover:bg-white/10 hover:text-white'"
      >
        {{ opt.label }}
      </button>
    </div>

    <!-- Employment Type Pills -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-xs font-semibold text-white/50 mr-1">Type:</span>
      <button
        v-for="opt in employmentOptions"
        :key="opt.value"
        type="button"
        @click="setEmployment(opt.value)"
        class="cursor-pointer rounded-xl px-3 py-1.5 text-xs font-medium transition duration-200"
        :class="selectedEmployment === opt.value
          ? 'bg-gold-400 text-navy-950 font-bold shadow-sm shadow-gold-400/30'
          : 'bg-white/5 text-white/70 hover:bg-white/10 hover:text-white'"
      >
        {{ opt.label }}
      </button>
    </div>
  </div>

  <!-- Results Count & Reset -->
  <div class="mt-4 flex items-center justify-between text-xs text-white/50 pt-3 border-t border-white/5">
    <span>
      Showing <strong class="text-gold-300 font-semibold">{{ filteredCount }}</strong> of {{ totalJobsCount }} opportunities
    </span>
    <button
      v-if="searchQuery || selectedWorkplace !== 'all' || selectedEmployment !== 'all'"
      type="button"
      @click="onReset"
      class="text-xs text-gold-400/80 hover:text-gold-300 underline cursor-pointer"
    >
      Clear filters
    </button>
  </div>
</div>
