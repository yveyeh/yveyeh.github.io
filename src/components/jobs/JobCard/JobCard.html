<div
  role="button"
  tabindex="0"
  :aria-label="`Open referral for ${job.title} at ${job.company}`"
  @click="openReferral"
  @keydown.enter="openReferral"
  @keydown.space.prevent="openReferral"
  class="group relative flex flex-col justify-between overflow-hidden rounded-3xl border border-white/10 bg-navy-800/40 p-6 sm:p-7 shadow-xl shadow-black/30 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-gold-400/50 hover:bg-navy-800/70 hover:shadow-2xl hover:shadow-gold-400/10 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-400"
>
  <!-- Featured glowing accent -->
  <div
    v-if="job.featured"
    class="absolute -top-12 -right-12 size-28 rounded-full bg-gold-400/15 blur-2xl transition duration-500 group-hover:bg-gold-400/25 pointer-events-none"
  />

  <div>
    <!-- Top row: Badges and Posted Date -->
    <div class="flex flex-wrap items-center justify-between gap-2.5 pb-4 border-b border-white/5">
      <div class="flex flex-wrap items-center gap-2">
        <!-- Workplace badge -->
        <span
          :class="['rounded-full border px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wider', workplaceBadgeClass]"
        >
          {{ job.workplaceType }}
        </span>
        <!-- Employment badge -->
        <span
          :class="['rounded-full border px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wider', employmentBadgeClass]"
        >
          {{ job.employmentType }}
        </span>
        <!-- Featured tag -->
        <span
          v-if="job.featured"
          class="rounded-full border border-gold-400/40 bg-gold-400/20 px-2.5 py-0.5 text-[11px] font-bold uppercase tracking-wider text-gold-300"
        >
          ★ Featured
        </span>
      </div>
      <span class="text-xs text-white/40 font-mono">{{ formattedDate }}</span>
    </div>

    <!-- Job Title & Company -->
    <div class="mt-4">
      <h3 class="text-xl font-bold tracking-tight text-white transition duration-200 group-hover:text-gold-300 sm:text-2xl">
        {{ job.title }}
      </h3>
      <div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-white/70">
        <span class="font-semibold text-white/90">{{ job.company }}</span>
        <span class="text-white/30">•</span>
        <span class="flex items-center gap-1 text-white/60">
          <svg class="size-3.5 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          {{ job.location }}
        </span>
        <span v-if="job.salaryRange" class="text-white/30">•</span>
        <span v-if="job.salaryRange" class="font-mono text-xs font-semibold text-emerald-400">
          {{ job.salaryRange }}
        </span>
      </div>
    </div>

    <!-- Description -->
    <p class="mt-4 text-sm font-light leading-relaxed text-white/70 line-clamp-3">
      {{ job.description }}
    </p>

    <!-- Tech Tags -->
    <div class="mt-5 flex flex-wrap gap-1.5">
      <span
        v-for="tag in job.tags"
        :key="tag"
        class="rounded-lg border border-white/5 bg-white/5 px-2.5 py-1 text-[11px] font-medium text-white/75 transition duration-200 group-hover:border-white/10 group-hover:bg-white/10"
      >
        #{{ tag }}
      </span>
    </div>
  </div>

  <!-- Footer with referral link action -->
  <div class="mt-6 flex items-center justify-between border-t border-white/10 pt-4">
    <span class="flex items-center gap-1.5 text-xs text-white/50 group-hover:text-gold-300/80 transition-colors">
      <span class="size-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Direct Referral Protected
    </span>
    <span
      class="inline-flex items-center gap-1.5 rounded-xl border border-gold-400/30 bg-gold-400/10 px-3.5 py-1.5 text-xs font-semibold text-gold-300 transition duration-300 group-hover:bg-gold-400 group-hover:text-navy-900 group-hover:shadow-md"
    >
      <span>Apply via Referral</span>
      <svg class="size-3.5 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    </span>
  </div>
</div>
