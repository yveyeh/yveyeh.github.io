services:
  mysql:
    image: mysql:8.0
    container_name: yveyeh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yveyeh_portfolio
      MYSQL_USER: yveyeh
      MYSQL_PASSWORD: yveyeh_secret_2026
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - yveyeh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "yveyeh", "-pyveyeh_secret_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yveyeh_mysql_data:

